steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
  - '--build-arg'
  - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
  - '--build-arg'
  - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
  - '-t'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/dhop-repo/dhop-fullstack:latest'
  - '.'

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/dhop-repo/dhop-fullstack:latest'

substitutions:
  _NEXT_PUBLIC_SUPABASE_URL: 'https://mock-supabase.supabase.co'
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: 'mock-anon-key'
  _NEXT_PUBLIC_FIREBASE_API_KEY: 'mock-api-key'
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'mock-auth-domain.firebaseapp.com'
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'mock-project-id'
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'mock-storage-bucket.appspot.com'
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
  _NEXT_PUBLIC_FIREBASE_APP_ID: '1:1234567890:web:mockappid'
